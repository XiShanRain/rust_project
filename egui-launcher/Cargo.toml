[package]
name = "egui-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
# 与 epaint 0.36.2 同一个字体解析器（Cargo.lock 已含 skrifa 0.44.0，由 epaint/glifo 引入），
# 特性声明照抄 epaint，避免 feature 统一把额外编译面带进来。
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
# global-hotkey = "0.8"
# E-06 托盘：tray-icon 提供系统托盘图标，muda 提供菜单项。两者配合实现 FR-SYS-01。
tray-icon = "0.19"
muda = "0.15"
# E-05：从 eframe CreationContext 的 window_handle() 取本机顶层 HWND（RawWindowHandle::Win32），
# 用于对自己的窗口发 WM_IME_CONTROL 切英文模式。0.6.2 已在依赖树中，不引入新编译面。
raw-window-handle = "0.6"
# FR-SRC-02 app_index.json 缓存：serde 序列化扫描结果，serde_json 落盘。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.11.0"
# FR-QRY-09 通配符 / 正则：`*`→`.*`、`?`→`.` 后交给 regex（Delphi `TRegExpr` 同口径）。
# 只在查询含 `*`/`?` 时编译一次，且编译结果每轮查询复用；将来的 Exclude 过滤也走这一条（计划 §562）。
regex = "1"

# 与 Cargo.lock 里 accesskit_windows / gpu-allocator / wgpu-hal 已用的主版本一致，不引入第二个 windows 大版本。
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # 打磨档 G3（选中内容动作面板）：全格式剪贴板快照要用 OLE 的 IDataObject
    #（`OleGetClipboard` / `OleSetClipboard` / `OleFlushClipboard` / `OleInitialize`）。
    # 只为取选区那一条路，别处不碰 OLE；`Win32_System_Com` 早就在，IDataObject 也从那里来。
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    # FR-SRC-10 计算器：Enter 把结果写进剪贴板。剪贴板三件套在 DataExchange；
    # CF_UNICODETEXT 常量在 Win32_System_Ole 但 SetClipboardData 收 u32 ⇒ 传裸 13，不为一个数字多开一条。
    "Win32_System_DataExchange",
    # GlobalAlloc/GlobalLock/GlobalUnlock（剪贴板要求的可移动内存块）。
    # 【2026-10-20 更正】批次 S 动手前我记的是「Memory 模块没有 feature 门、已随 Win32_Foundation 白送」，
    # 编译直接 E0432 打脸：它就在 `#[cfg(feature = "Win32_System_Memory")]` 后面。本批净新增 2 条 feature。
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # 批次 D2 第二半「下载站点图标」：WinHTTP 直调（AHK 那边用 WinHttpRequest COM）。
    # 只在这里出网，也就是用户点「下载图标」那一刻。
    "Win32_Networking_WinHttp",
    # 批次 A2（FR-SRC-17）「锁定屏幕」：LockWorkStation 在这个模块里。
    # 关机的三条（shutdown /r /s /l）走 shutdown.exe，不需要 Token 提权那一套。
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

